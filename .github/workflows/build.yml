name: Build SAWT AI Android

on:
  push:
    branches:
      - main
      - master
      - redesign/**
    paths:
      - 'app/**'
      - 'voice-engine/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - 'backend/v2/**'
      - 'render.yaml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sawt-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 16 SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download pinned Sherpa-ONNX Android runtime
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 --retry-all-errors --connect-timeout 30 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            -o app/libs/sherpa-onnx-2.0.1.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa-onnx-2.0.1.aar" | sha256sum --check -

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: voice-engine/package.json

      - name: Build offline Arabic diacritizer WebView assets
        working-directory: voice-engine
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s ../app/src/main/assets/voice_engine/tashkeel.html

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Android tests, lint and build debug APK
        env:
          ORG_GRADLE_PROJECT_SAWT_API_BASE_URL: ${{ vars.SAWT_API_BASE_URL }}
          ORG_GRADLE_PROJECT_SAWT_FIREBASE_WEB_API_KEY: ${{ secrets.SAWT_FIREBASE_WEB_API_KEY }}
          ORG_GRADLE_PROJECT_SAWT_FIREBASE_PROJECT_ID: ${{ vars.SAWT_FIREBASE_PROJECT_ID }}
        run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SAWT-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SAWT-AI-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
