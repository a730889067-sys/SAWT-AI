name: Build SAWT AI Android

on:
  push:
    branches:
      - main
      - master
      - redesign/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check backend JavaScript syntax
        run: node --check backend/index.js

      - name: Build upstream Nabra package from its source
        run: |
          git clone https://github.com/Oddadmix/nabra-tts.git nabra-tts-src
          git -C nabra-tts-src checkout 16b5281ce61993df3526740990cf845a3f3036f4
          npm --prefix nabra-tts-src install --no-audit --no-fund
          npm --prefix nabra-tts-src run typecheck
          npm --prefix nabra-tts-src test
          npm --prefix nabra-tts-src run build

      - name: Build SAWT offline engine bundle
        working-directory: voice-engine
        run: |
          npm install --no-audit --no-fund
          mkdir -p public node_modules/nabra-tts
          cp ../THIRD_PARTY_NOTICES.md public/THIRD_PARTY_NOTICES.md
          cp -R ../nabra-tts-src/dist node_modules/nabra-tts/
          cp ../nabra-tts-src/package.json ../nabra-tts-src/LICENSE ../nabra-tts-src/THIRD_PARTY_NOTICES.md node_modules/nabra-tts/
          npm run build

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android lint and build debug APK
        env:
          ORG_GRADLE_PROJECT_SAWT_API_BASE_URL: ${{ vars.SAWT_API_BASE_URL }}
        run: gradle lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAWT-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAWT-AI-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
